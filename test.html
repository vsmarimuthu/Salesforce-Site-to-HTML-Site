<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
  <title>Home - Support Portal</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }

    /* 1. Button Loader: sits cleanly in the bottom-right corner until the chat button appears */
    #chat-button-loader {
      position: fixed; bottom: 20px; right: 20px; width: 56px; height: 56px;
      border-radius: 50%; background: #032d60; display: flex;
      align-items: center; justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.3); z-index: 9999;
      transition: opacity 0.2s ease;
    }
    #chat-button-loader .spinner {
      width: 22px; height: 22px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.35); border-top-color: #fff;
      animation: chat-spin .9s linear infinite;
    }

    /* 2. Window Loader: dynamically sized to match Salesforce's iframe */
    #chat-window-loader {
      position: fixed;
      background: #ffffff;
      border-radius: 12px 12px 0 0;
      box-shadow: 0 4px 20px rgba(0,0,0,.18);
      display: none; flex-direction: column; align-items: center; justify-content: center;
      z-index: 100000; font-size: 14px; color: #333;
      pointer-events: none; /* Allows clicking inside chat even while fading out */
      transition: opacity 0.25s ease;
    }
    #chat-window-loader .window-spinner {
      width: 32px; height: 32px; border-radius: 50%; margin-bottom: 12px;
      border: 3px solid rgba(3,45,96,.2); border-top-color: #032d60;
      animation: chat-spin .9s linear infinite;
    }

    @keyframes chat-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <h2>Welcome to Our Support Portal</h2>

  <!-- Button Loader -->
  <div id="chat-button-loader" role="status" aria-label="Chat button is loading">
    <div class="spinner"></div>
  </div>

  <!-- Window Loader -->
  <div id="chat-window-loader" role="status" aria-label="Connecting to support">
    <div class="window-spinner"></div>
    <div>Connecting to Arden Assistant...</div>
  </div>

  <script type="text/javascript">
    var hasOpenedOnce = false;
    var windowLoaderTimer = null;

    function removeButtonLoader() {
      var btnLoader = document.getElementById("chat-button-loader");
      if (btnLoader) { btnLoader.remove(); }
    }

    function syncLoaderToIframe() {
      var iframe = document.getElementById("embeddedMessagingFrame");
      var winLoader = document.getElementById("chat-window-loader");
      if (!iframe || !winLoader) return;

      var rect = iframe.getBoundingClientRect();
      if (rect.width > 100 && rect.height > 100) {
        winLoader.style.top = rect.top + "px";
        winLoader.style.left = rect.left + "px";
        winLoader.style.width = rect.width + "px";
        winLoader.style.height = rect.height + "px";
      }
    }

    function showWindowLoader() {
      if (hasOpenedOnce) return; // Only show on the very first chat open
      hasOpenedOnce = true;

      var winLoader = document.getElementById("chat-window-loader");
      if (!winLoader) return;

      // Wait 1 animation frame so Salesforce applies its maximized dimensions first
      requestAnimationFrame(function () {
        syncLoaderToIframe();
        winLoader.style.opacity = "1";
        winLoader.style.display = "flex";
      });

      // Keep syncing briefly while CSS transitions finish, then auto-hide cleanly
      var syncInterval = setInterval(syncLoaderToIframe, 100);
      clearTimeout(windowLoaderTimer);
      windowLoaderTimer = setTimeout(function () {
        clearInterval(syncInterval);
        hideWindowLoader();
      }, 2200); // Hides smoothly right as Arden Assistant's greeting renders
    }

    function hideWindowLoader() {
      clearTimeout(windowLoaderTimer);
      var winLoader = document.getElementById("chat-window-loader");
      if (winLoader && winLoader.style.display !== "none") {
        winLoader.style.opacity = "0";
        setTimeout(function () {
          winLoader.style.display = "none";
        }, 250);
      }
    }

    // Lifecycle Listeners
    window.addEventListener("onEmbeddedMessagingButtonCreated", removeButtonLoader);
    window.addEventListener("onEmbeddedMessagingBusinessHoursEnded", removeButtonLoader);
    window.addEventListener("onEmbeddedMessagingWindowMaximized", showWindowLoader);
    window.addEventListener("onEmbeddedMessagingConversationOpened", hideWindowLoader);
    window.addEventListener("onEmbeddedMessagingFirstBotMessageSent", hideWindowLoader);
    window.addEventListener("onEmbeddedMessagingWindowMinimized", hideWindowLoader);

    window.addEventListener("unhandledrejection", function (event) {
      if (event.reason && String(event.reason).includes("Embedded Messaging configuration")) {
        removeButtonLoader();
      }
    });

    function initEmbeddedMessaging() {
      try {
        embeddedservice_bootstrap.settings.language = 'en_US';
        embeddedservice_bootstrap.init(
          '00DS900000JusM9',
          'Student_Support_Chat',
          'https://site.com',
          {
            scrt2URL: 'https://salesforce-scrt.com'
          }
        );
      } catch (err) {
        console.error('Error loading Embedded Messaging: ', err);
        removeButtonLoader();
        hideWindowLoader();
      }
    }
  </script>
  <script type="text/javascript"
          src="https://site.com/assets/js/bootstrap.min.js"
          onload="initEmbeddedMessaging()"
          onerror="removeButtonLoader()"></script>

</body>
</html>
